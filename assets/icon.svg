<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#434A54"/>
      <stop offset="1" stop-color="#191D23"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FC38C"/>
      <stop offset="1" stop-color="#1B8A5F"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- the squircle -->
  <g filter="url(#drop)">
    <rect x="100" y="90" width="824" height="824" rx="190" fill="url(#body)"/>
    <!-- a hairline of light along the top edge, so it does not read as a flat slab -->
    <rect x="100" y="90" width="824" height="824" rx="190" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- the pointer -->
  <g filter="url(#lift)">
    <path d="M356 236 L 356 700 L 465 596 L 542 768 L 638 725 L 559 555 L 706 543 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- the tick that says it landed -->
  <g filter="url(#lift)">
    <circle cx="700" cy="700" r="152" fill="url(#tick)"/>
    <path d="M628 700 l 52 54 l 96 -108" fill="none" stroke="#FFFFFF" stroke-width="46"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
